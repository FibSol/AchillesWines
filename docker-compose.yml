# =============================================================================
# Achilles's Wines — docker-compose orchestration (ADR-004)
# Three services share a single SQLite DB via a named volume.
# Bind-mount the host repo only for `data/`, `logs/`, and `raw/` so they survive
# container rebuilds.
# =============================================================================

x-restart-policy: &restart unless-stopped

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: achilles-web:local
    container_name: achilles-web
    restart: *restart
    logging: *default-logging
    environment:
      DATABASE_URL: /data/achilles.db
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Achilles's Wines}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-fr}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    volumes:
      - achilles-data:/data
      - achilles-logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - achilles

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    image: achilles-scraper:local
    container_name: achilles-scraper
    restart: *restart
    logging: *default-logging
    environment:
      DATABASE_URL: /data/achilles.db
      # Optional API keys for non-default sources — set in .env (gitignored).
      FRANKFURTER_API_BASE: ${FRANKFURTER_API_BASE:-https://api.frankfurter.app}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      # CellarTracker parallel sweep tuning
      ACHILLES_CT_WORKERS: ${ACHILLES_CT_WORKERS:-15}
      ACHILLES_CT_MIN_SCORE: ${ACHILLES_CT_MIN_SCORE:-0}
      ACHILLES_CT_WAIT_MS: ${ACHILLES_CT_WAIT_MS:-2500}
    volumes:
      - achilles-data:/data
      - achilles-logs:/app/logs
      - achilles-raw:/app/raw
    depends_on:
      web:
        condition: service_healthy
    networks:
      - achilles

  nginx:
    image: nginx:1.27-alpine
    container_name: achilles-nginx
    restart: *restart
    logging: *default-logging
    ports:
      - "${ACHILLES_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - achilles-logs:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - achilles

volumes:
  achilles-data:
    name: achilles-data
  achilles-logs:
    name: achilles-logs
  achilles-raw:
    name: achilles-raw

networks:
  achilles:
    name: achilles
    driver: bridge
