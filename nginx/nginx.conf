# =============================================================================
# Achilles's Wines — nginx reverse proxy (LAN-friendly defaults).
# Strips path/query verbatim to the Next.js standalone server. No TLS here —
# add it at the HA add-on ingress layer (ADR-004) or behind a Caddy/Traefik
# front for WAN exposure.
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format compact '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       'rt=$request_time ut=$upstream_response_time';
    access_log /var/log/nginx/access.log compact;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip — Next.js already pre-compresses .js/.css in standalone output; this
    # picks up the dynamic responses (HTML/JSON) only.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Single upstream — the docker-compose service name resolves via the
    # Docker DNS (network: achilles).
    upstream achilles_web {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Generous body limit for CSV imports (cellar inventory).
        client_max_body_size 8m;

        # Inexpensive health endpoint used by docker-compose healthcheck.
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Long cache for hashed Next.js static assets.
        location /_next/static/ {
            proxy_pass http://achilles_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Everything else → Next.js.
        location / {
            proxy_pass http://achilles_web;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
