name: "Achilles's Wines"
description: "Personal wine cellar & market intelligence — web UI + scraper sidecar"
version: "1.1.1"
slug: "achilles_wines"
init: false
homeassistant_api: false
hassio_api: false
ingress: true
ingress_port: 3000
panel_icon: "mdi:glass-wine"
panel_title: "Achilles"
host_network: false
map:
  - share:rw  # NAS share for backups
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Web UI (Next.js)"
options:
  backup_passphrase: ""
  http_port: 3000
  log_level: "info"
schema:
  backup_passphrase: str
  http_port: int(3000,65535)
  log_level: list(debug|info|warning|error)
